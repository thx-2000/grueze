; Angenähert an typische Shared-Hosting-Defaults (all-inkl KAS), fürs lokale Testen.
memory_limit = 256M
; Galerie-Uploads: Bilder sind klein, Videos können groß werden. all-inkl
; erlaubt das Hochsetzen über eine eigene php.ini im Webspace-Root.
upload_max_filesize = 512M
post_max_size = 520M
max_execution_time = 120
max_input_vars = 3000
date.timezone = Europe/Berlin
session.gc_maxlifetime = 1800
expose_php = Off
